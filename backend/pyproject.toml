[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "av>=14.0",
    "boto3>=1.43.61",
    "fastapi>=0.115",
    "fsrs>=6.3.2",
    "greenlet>=3.5.3",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
seed = [
    "faster-whisper>=1.2.1",
]
# Kokoro-82M text-to-speech: the worker image (`ARG EXTRAS=tts`) and nothing
# else -- the API image installs none of this. Torch is the CPU build (see
# [tool.uv.sources]); the seed machine uses `tts-gpu` instead.
tts = [
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    # Without this floor uv resolves transformers 4.12, whose `tokenizers`
    # needs a Rust toolchain to build on 3.14.
    "transformers>=4.40",
    "torch",
    # misaki downloads this at runtime when it is missing; pinned as a wheel
    # so the worker never reaches for the network.
    "en_core_web_sm",
]
# Same set with CUDA torch, for the RTX 3060 seed run. Conflicts with `tts`
# (one environment holds one torch build) -- see [tool.uv] below.
tts-gpu = [
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    "transformers>=4.40",
    "torch",
    "en_core_web_sm",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
conflicts = [
    [{ extra = "tts" }, { extra = "tts-gpu" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "tts" },
    { index = "pytorch-cu128", extra = "tts-gpu" },
]
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# One event loop for the whole test session: the async DB engine's asyncpg
# connections are bound to whichever loop is running when they're first
# used, so per-test loops (pytest-asyncio's function-scoped default) break
# any test that reuses the module-level `engine` across tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
