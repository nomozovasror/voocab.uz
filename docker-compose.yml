services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      # Reach the db service by name (overrides the localhost default and any
      # DATABASE_URL in a mounted .env, since real env vars win in pydantic).
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/app
    # Telegram/session secrets are read from backend/.env (bind-mounted here);
    # see backend/.env.example.
    depends_on:
      - db
    # Auto-recover from a crash (pairs with the worker's startup recover_stale).
    restart: unless-stopped

  worker:
    # Same image/codebase as the API, different entrypoint: the background
    # process. No ports — it's not an HTTP service. Two loops: the Postgres-
    # backed ASR transcription queue (§9, polling
    # audio_blob.transcript_status), the periodic refresh of the
    # material_difficulty projection, the lexicon enrichment, the TTS render
    # queue (audio_renders) and the word-clip cutter.
    #
    # One instance. A second would double the difficulty refresh — harmless,
    # it is an idempotent upsert, but pointless; the transcription half is
    # the part that is safe to scale out (SKIP LOCKED), and DIFFICULTY_REFRESH_INTERVAL_S=0
    # is how a second instance would opt out of the other half.
    #
    # Built with the `tts` extra (Kokoro-82M, CPU torch, the baked-in weights)
    # for the text-to-speech render loop; the API image above stays without it.
    build:
      context: ./backend
      args:
        EXTRAS: tts
    command: uv run --no-sync python -m app.worker
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/app
    # GROQ_API_KEY (and anything else the worker needs) comes from
    # backend/.env, bind-mounted the same way as the backend service.
    depends_on:
      - db
    # Auto-recover from a crash; recover_stale() at startup reclaims any blob
    # left `processing` by the crash.
    restart: unless-stopped

volumes:
  pgdata:
